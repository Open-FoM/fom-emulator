; Shared PacketInspector configuration (server + hook)

[Logging]
Enabled=1
LogRecv=1
LogSend=1
HexDump=1
BitDump=0
BitDumpMSB=0
LogLithPayloads=1
IncludeAddr=1
IncludeConn=1
SuppressRepeats=1
SuppressRepeatsInFile=0
EmitSuppressedLine=0
EmitAnsiConsole=1
StrictParsing=1
BestGuessParsing=1
DispatchStatus=1
NameOnlyLabels=1
TraceOffsets=1
TraceRakParse=1
TraceRakParseVerbose=1
MaxDump=4096
MaxBits=0
BitsPerLine=128
MinIntervalMs=0
RepeatSuppressMs=0
AllowConsoleIds=
AllowFileIds=
IgnoreIds=

[LoggingProfiles]
ActiveProfile=Default

[LogProfile.Default]
; Syntax: <Tag>=<ids>@<repeatMs>  (use "!" to suppress, "*" for any id)
; Tags: RakRecv, RakSend, LithRecv, LithSend
All=@1500
RakRecv=0x08,0x0A@2000
RakSend=0x80,0x00,0x40,0xC0@2000
LithSend=0x03,0x00@2500
