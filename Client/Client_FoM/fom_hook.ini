; FoM hook configuration

[Logging]
LogRecv=1
LogSend=1
HexDump=1
MaxDump=4096
BitDump=1
BitDumpMSB=0
LogLithPayloads=1
MaxBits=0
BitsPerLine=128
ToggleKey=113
; Suppression timing is controlled by profiles below.
MinIntervalMs=0
RepeatSuppressMs=0
DecodeLogin6D=1
LoginDumpBits=2048
LogPath=

[LoggingProfiles]
ActiveProfile=Default

[LogProfile.Default]
; Simple profile rules (no RuleN needed)
; Syntax: <Tag>=<ids>@<repeatMs>   (use "!" to suppress, "*" for any id)
; Tags: RakRecv, RakSend, LithRecv, LithSend
; Examples:
; RakRecv=0x08,0x0A@2000
; RakSend=0x80,0x00,0x40,0xC0@2000
; LithSend=0x03,0x00@2500
; RakRecv=*@1500
; All=*@1500   (applies to all packets)
All=@1500
RakRecv=0x08,0x0A@2000
RakSend=0x80,0x00,0x40,0xC0@2000
LithSend=0x03,0x00@2500

[LogProfile.Quiet]
; Example: suppress chatty RakNet recv ids
All=@4000
RakRecv=0x08,0x0A!
RakSend=0x80,0x00,0x40,0xC0@5000
LithSend=0x03,0x00@5000

[Overlay]
Enable=1
ToggleKey=112
TestMode=1
Window=1
D3D=0

[Console]
Enable=1

[Chat]
TravelCommand=1

[WrapperHooks]
Enable=1

[Hook]
RescanMs=5000

[Events]
Log=1
PeekOnRead=1

[RakNet]
Enable=1

[Huffman]
DumpTable=0
TablePath=..\Server\apps\master\huffman_table_runtime.json

[Items]
Enable=0
OverrideBase=0
OverrideRuntime=0
TemplateDump=0
AppearanceDump=0
OverridesPath=item_overrides.csv
TemplateDumpPath=..\Docs\Exports\item_templates_raw.csv
AppearanceDumpPath=..\..\Docs\Appearance\Appearance_ItemTemplate.csv

[FileId]
Dump=1
DumpPath=..\..\Docs\FileIdMap.csv
PreloadList=..\..\Docs\WorldServiceResourceList.md
PreloadRetryMs=1000

[Worlds]
Enable=0
Dump=1
DumpClassLabels=1
DumpClassColors=1
CShellHook=1
ClassLabelOverride=1
necarsfield.ClassLabel=1
; Set Dump=1 to log the table once on startup even if Enable=0.
; Set DumpClassLabels=1 to log class label lookups (ILTClient::GetString + LoadString).
; Set DumpClassColors=1 to log the color used when the class label UI text is created.
; Set ClassLabelOverride=1 to apply per-world ClassLabel overrides.
; Override format (index-based or name-based):
; 01.Folder=NY_Manhattan
; 01.Display=NYC - Manhattan
; 01.Icon=interface/worlds/01.pcx
; 01.Class=4
; NY_Manhattan.Folder=MyCustomWorld
; NY_Manhattan.Display=My Custom World
; NY_Manhattan.Icon=interface/worlds/99.pcx
; NY_Manhattan.Class=4
; Use "none" for Display/Icon to clear the pointer.
; Class label override (HUD): set per-world ClassLabel (1..5).
; Example: necarsfield.ClassLabel=1
; --- World scaffolding (defaults) ---
